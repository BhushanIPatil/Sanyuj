name: sanyuj
description: Sanyuj — trusted local help near you.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  device_info_plus: ^11.5.0
  package_info_plus: ^9.0.0
  flutter_local_notifications: ^22.3.0
  path_provider: ^2.1.6
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/sanyuj_logo.png
    - assets/brand/sanyuj_lockup.png
    - assets/brand/sanyuj_transparent.png
